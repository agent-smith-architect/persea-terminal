name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TMPDIR: /tmp

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y tmux less
      # Replay real journal captures with the UI's installed, patched xterm.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: cd ui && npm ci
      - run: go vet ./... && go build ./...
      # The installer runs these tests with a 20-byte TMPDIR (deploy/install.sh).
      # Use one as long here, so a Unix socket path that fits only under /tmp
      # fails in CI rather than at install.
      - run: mkdir -p /tmp/pt.ci-tests/w/t && TMPDIR=/tmp/pt.ci-tests/w/t CGO_ENABLED=1 go test -race ./...

  ui:
    name: UI (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Contracts
            command: npm test
          - name: Dashboard
            command: npm run test:browser:dashboard
          - name: Terminal
            command: npm run test:browser:terminal
          - name: Controls
            command: npm run test:browser:controls
          - name: Workspace
            command: npm run test:browser:workspace
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ui/.nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - run: sudo apt-get update && sudo apt-get install -y tmux less clang
      - name: Package manager
        run: npm install --global npm@latest && npm --version
      - name: CI reachability
        run: node test/ci_reachability.cjs
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium webkit
      - name: Browser versions
        run: |
          node <<'NODE'
          const playwright = require('playwright');
          console.log(`Playwright ${require('playwright/package.json').version}`);
          (async () => {
            for (const name of ['chromium', 'webkit']) {
              const browser = await playwright[name].launch({ headless: true });
              try {
                console.log(`${name} ${browser.version()}`);
              } finally {
                await browser.close();
              }
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - run: ${{ matrix.command }}
      - name: Local runtime lifecycle
        if: matrix.name == 'Workspace'
        run: bash ../scripts/local-runtime-test.sh

  deploy-checks:
    name: Deploy tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: python3 deploy/tests/host-config-test.py
      - run: bash deploy/tests/hermetic-deploy-test.sh
      - name: Shell syntax
        run: for f in deploy/*.sh scripts/*.sh deploy/tests/*.sh; do bash -n "$f"; done
