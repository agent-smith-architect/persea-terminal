name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TMPDIR: /tmp

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y tmux less
      - run: go vet ./... && go build ./...
      - run: CGO_ENABLED=1 go test -race ./...

  ui:
    name: UI (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Contracts
            command: npm test
          - name: Dashboard
            command: npm run test:browser:dashboard
          - name: Terminal
            command: npm run test:browser:terminal
          - name: Controls
            command: npm run test:browser:controls
          - name: Workspace
            command: npm run test:browser:workspace
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/.nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: sudo apt-get update && sudo apt-get install -y tmux less clang
      - name: Package manager
        run: npm install --global npm@latest
      - name: CI reachability
        run: node test/ci_reachability.cjs
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: ${{ matrix.command }}
      - name: Local runtime lifecycle
        if: matrix.name == 'Workspace'
        run: bash ../scripts/local-runtime-test.sh

  deploy-checks:
    name: Deploy tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: python3 deploy/tests/host-config-test.py
      - run: bash deploy/tests/hermetic-deploy-test.sh
      - name: Shell syntax
        run: for f in deploy/*.sh scripts/*.sh deploy/tests/*.sh; do bash -n "$f"; done
